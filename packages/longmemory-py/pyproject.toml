#  file  : packages/longmemory-py/pyproject.toml
#  usage : packages the LongMemory Python HTTP SDK for PyPI

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longmemory-sdk"
version = "1.0.0"
description = "Zero-dependency Python client for the self-hosted LongMemory API"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "CaviraOSS" },
  { name = "nullure" },
]
keywords = ["ai", "agents", "longmemory", "memory", "mcp", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/CaviraOSS/LongMemory"
Documentation = "https://github.com/CaviraOSS/LongMemory#readme"
Issues = "https://github.com/CaviraOSS/LongMemory/issues"
Source = "https://github.com/CaviraOSS/LongMemory"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
longmemory = ["py.typed"]
