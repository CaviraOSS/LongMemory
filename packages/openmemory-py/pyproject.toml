#  file  : packages/openmemory-py/pyproject.toml
#  usage : redirects the legacy openmemory-py distribution to longmemory-sdk

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmemory-py"
version = "2.0.0"
description = "Deprecated compatibility bridge to longmemory-sdk"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["longmemory-sdk>=1.0.0,<2"]
authors = [{ name = "CaviraOSS" }, { name = "nullure" }]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/CaviraOSS/LongMemory"
Migration = "https://github.com/CaviraOSS/LongMemory/blob/main/MIGRATION.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
